```html
<!DOCTYPE html>
<html>
<head>
  <title>LOUD VIDEO</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <video id="video" autoplay playsinline controls>
    <source src="video.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("video");

    video.volume = 1.0;
    video.muted = false;

    // Try to start immediately with sound
    video.play().catch(() => {
      // Browser blocked autoplay with sound.
      // Start as soon as the user interacts with the page.
      document.addEventListener("click", () => {
        video.muted = false;
        video.volume = 1.0;
        video.play();
      }, { once: true });
    });
  </script>

</body>
</html>
```
